<!DOCTYPE html>

  <title>项目执行跟踪平台</title>

  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: { preflight: false },
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#007069',
              light: 'rgba(0,112,105,0.1)',
              50: '#e6f2f1',
              100: '#b3d9d6',
              200: '#80c0bb',

          }
        }
      }

<body>

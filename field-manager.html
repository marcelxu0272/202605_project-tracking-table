<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目追踪表 — 字段字典管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50:'#eff6ff', 100:'#dbeafe', 600:'#2563eb', 700:'#1d4ed8', 800:'#1e40af', 900:'#1e3a5f' }
          }
        }
      }
    }
  </script>
  <style>
    /* 动态 badge 样式，避免 Tailwind JIT 扫描问题 */
    .badge-sync    { background:#dbeafe; color:#1e40af; border:1px solid #bfdbfe; }
    .badge-manual  { background:#fef3c7; color:#92400e; border:1px solid #fde68a; }
    .badge-calc    { background:#d1fae5; color:#065f46; border:1px solid #a7f3d0; }
    .dtype-金额    { background:#f0fdf4; color:#166534; }
    .dtype-文本    { background:#f8fafc; color:#475569; }
    .dtype-分类    { background:#faf5ff; color:#6b21a8; }
    .dtype-日期    { background:#fff7ed; color:#9a3412; }
    .dtype-比率    { background:#ecfeff; color:#155e75; }
    .dtype-布尔    { background:#fdf2f8; color:#86198f; }

    .section-row   { background: #f1f5f9; }
    .section-bar   { width:4px; display:inline-block; border-radius:2px; height:14px; margin-right:8px; vertical-align:middle; }

    .formula-tag   { display:inline-flex; align-items:center; background:#e0f2fe; color:#0369a1;
                     border:1px solid #bae6fd; border-radius:4px; padding:0 6px; font-size:12px;
                     margin:1px; white-space:nowrap; }
    .formula-eq    { color:#64748b; font-family:monospace; font-size:12px; }

    tr.data-row:hover td { background:#f8fafc; }

    .search-focus:focus { outline:none; box-shadow:0 0 0 3px rgba(37,99,235,0.15); }

    /* 折叠动画 */
    .section-body { transition: opacity 0.15s; }
    .section-body.collapsed { display:none; }

    /* 滚动条美化 */
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:#f1f5f9; }
    ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }

    /* 模态框动画 */
    @keyframes modal-in { from { opacity:0; transform:scale(0.96); } to { opacity:1; transform:scale(1); } }
    .modal-box { animation: modal-in 0.15s ease; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

<!-- ═══ 顶部 Header ═══ -->
<header class="bg-gradient-to-r from-slate-800 to-slate-700 text-white shadow-lg">
  <div class="max-w-screen-2xl mx-auto px-6 py-4 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-blue-500 rounded-lg flex items-center justify-center text-lg font-bold shadow">📊</div>
      <div>
        <h1 class="text-lg font-semibold leading-tight">项目追踪表 · 字段字典</h1>
        <p class="text-slate-400 text-xs mt-0.5">Field Dictionary Manager · S520 金山中心</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div class="relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input id="searchInput" type="text" placeholder="搜索列号、字段名…"
          class="search-focus bg-slate-600 text-white placeholder-slate-400 text-sm rounded-lg pl-9 pr-4 py-2 w-56 border border-slate-500 transition-colors focus:bg-slate-500">
      </div>
      <button onclick="openModal()" class="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        新增字段
      </button>
      <button onclick="exportJSON()" class="flex items-center gap-1.5 bg-slate-600 hover:bg-slate-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/></svg>
        导出 JSON
      </button>
      <label class="flex items-center gap-1.5 bg-slate-600 hover:bg-slate-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors cursor-pointer" title="从外部 JSON 覆盖当前数据">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M17 8l-5-5-5 5M12 3v12"/></svg>
        导入 JSON
        <input type="file" class="hidden" id="fileInput" accept=".json" onchange="importJSON(this)">
      </label>
      <button type="button" onclick="resetToDefault()" class="flex items-center gap-1.5 bg-slate-600 hover:bg-slate-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors" title="清除浏览器本地修改，恢复 fields-data.js 默认数据">
        恢复默认
      </button>
    </div>
  </div>
</header>

<!-- ═══ 统计卡片 ═══ -->
<div class="max-w-screen-2xl mx-auto px-6 py-4">
  <div id="statsBar" class="grid grid-cols-4 gap-3"></div>
</div>

<!-- ═══ 过滤栏 ═══ -->
<div class="max-w-screen-2xl mx-auto px-6 pb-4">
  <div class="bg-white rounded-xl border border-slate-200 px-4 py-3 flex items-center gap-3 flex-wrap shadow-sm">
    <span class="text-xs font-medium text-slate-500 uppercase tracking-wide shrink-0">来源筛选</span>
    <div id="filterChips" class="flex gap-2 flex-wrap"></div>
    <div class="ml-auto flex items-center gap-2">
      <button onclick="expandAll()" class="text-xs text-slate-500 hover:text-slate-700 px-2 py-1 rounded hover:bg-slate-100 transition-colors">展开全部</button>
      <span class="text-slate-300">|</span>
      <button onclick="collapseAll()" class="text-xs text-slate-500 hover:text-slate-700 px-2 py-1 rounded hover:bg-slate-100 transition-colors">折叠全部</button>
      <span id="resultCount" class="text-xs text-slate-400 ml-2"></span>
    </div>
  </div>
</div>

<!-- ═══ 主表格 ═══ -->
<div class="max-w-screen-2xl mx-auto px-6 pb-10">
  <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm border-collapse">
        <thead>
          <tr class="bg-slate-700 text-white">
            <th class="text-left px-4 py-3 font-medium w-14">列号</th>
            <th class="text-left px-4 py-3 font-medium w-44">中文名称</th>
            <th class="text-left px-4 py-3 font-medium w-44 text-slate-300">英文名称</th>
            <th class="text-left px-4 py-3 font-medium w-30">来源类型</th>
            <th class="text-left px-4 py-3 font-medium w-24">数据类型</th>
            <th class="text-left px-4 py-3 font-medium">计算逻辑</th>
            <th class="text-left px-4 py-3 font-medium">说明</th>
            <th class="text-left px-4 py-3 font-medium w-24">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div id="emptyState" class="hidden py-16 text-center">
      <div class="text-4xl mb-3">🔍</div>
      <p class="text-slate-400 text-sm">没有匹配的字段</p>
    </div>
  </div>
</div>

<!-- ═══ 编辑/新增 模态框 ═══ -->
<div id="editModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
  <div class="modal-box bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
      <h2 id="modalTitle" class="text-base font-semibold text-slate-800">新增字段</h2>
      <button onclick="closeModal()" class="w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-600 transition-colors">✕</button>
    </div>
    <form id="fieldForm" onsubmit="event.preventDefault(); saveField();" class="px-6 py-5 space-y-4">
      <input type="hidden" id="fieldId">

      <div class="grid grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">列号 <span class="text-red-400">*</span></label>
          <input type="text" id="col" required placeholder="如 P、AA"
            class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400 uppercase placeholder:normal-case">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">数据类型</label>
          <select id="data_type" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400">
            <option value="金额">金额</option>
            <option value="文本">文本</option>
            <option value="分类">分类</option>
            <option value="日期">日期</option>
            <option value="比率">比率</option>
            <option value="布尔">布尔</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">来源类型</label>
          <select id="source_type" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400">
            <option value="system_sync">📥 系统同步</option>
            <option value="manual_input">✏️ 手工填报</option>
            <option value="auto_calc">🧮 自动计算</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">中文名称 <span class="text-red-400">*</span></label>
          <input type="text" id="name_cn" required placeholder="如：总合同额"
            class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">英文名称</label>
          <input type="text" id="name_en" placeholder="如：Contract Value"
            class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400">
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">所属分区</label>
        <select id="section" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400">
          <option value="项目基本信息">项目基本信息 (A–K)</option>
          <option value="合同签署与进展">合同签署与进展 (L–M)</option>
          <option value="合同额">合同额 (N–Q)</option>
          <option value="开票差与完成差">开票差与完成差 (R–S)</option>
          <option value="始累完成合同额">始累完成合同额 (T–V)</option>
          <option value="年度完成额申报">年度完成额申报 (W–Z)</option>
          <option value="开票回款情况">开票回款情况 (AA–AF)</option>
          <option value="财务数据（WIP/应收）">财务数据（WIP/应收）(AG–AI)</option>
          <option value="应收账款及WIP">应收账款及WIP (AJ–AL)</option>
          <option value="WIP分析与措施">WIP分析与措施 (AM–AU)</option>
          <option value="完成额统计与预测">完成额统计与预测 (AV–BG)</option>
          <option value="开票与回款统计预测">开票与回款统计预测 (BH–CE)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">计算逻辑 / 公式</label>
        <input type="text" id="calc_logic" placeholder="如：=P-N 或 =SUM(AV~AZ)"
          oninput="previewFormula(this.value)"
          class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400">
        <div id="formulaPreview" class="mt-2 min-h-7 flex flex-wrap gap-1 items-center px-3 py-2 bg-slate-50 rounded-lg border border-dashed border-slate-200 text-xs text-slate-400"></div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">枚举值（可选，逗号分隔）</label>
        <input type="text" id="enum_values" placeholder="如：进行中,已完成,暂缓"
          class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">说明</label>
        <textarea id="description" rows="3" placeholder="详细说明、业务规则或备注"
          class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400 resize-none"></textarea>
      </div>

      <div class="flex justify-end gap-3 pt-2 border-t border-slate-100">
        <button type="button" onclick="closeModal()"
          class="px-4 py-2 text-sm text-slate-600 border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors">取消</button>
        <button type="submit"
          class="px-5 py-2 text-sm text-white bg-blue-600 hover:bg-blue-500 rounded-lg transition-colors font-medium shadow-sm">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- ═══ 字段详情侧栏 ═══ -->
<div id="detailPanel" class="fixed inset-y-0 right-0 w-96 bg-white shadow-2xl border-l border-slate-200 z-40 translate-x-full transition-transform duration-200 flex flex-col">
  <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100 bg-slate-50">
    <h3 class="font-semibold text-slate-700 text-sm">字段详情</h3>
    <button onclick="closeDetail()" class="w-7 h-7 rounded-lg hover:bg-slate-200 flex items-center justify-center text-slate-400 text-xs transition-colors">✕</button>
  </div>
  <div id="detailContent" class="flex-1 overflow-y-auto px-5 py-4 space-y-4 text-sm"></div>
</div>

<!-- 同目录 JS 可在 file:// 下加载，无需每次手动导入 -->
<script src="fields-data.js"></script>

<script>
/* ══════════════════════════════════════════
   配置
══════════════════════════════════════════ */
const TYPE_CONFIG = {
  system_sync:  { label: '系统同步', icon: '📥', badgeClass: 'badge-sync',   color: '#3b82f6' },
  manual_input: { label: '手工填报', icon: '✏️', badgeClass: 'badge-manual', color: '#f59e0b' },
  auto_calc:    { label: '自动计算', icon: '🧮', badgeClass: 'badge-calc',   color: '#10b981' },
};

const SECTION_COLORS = [
  '#3b82f6','#6366f1','#8b5cf6','#06b6d4',
  '#10b981','#f59e0b','#ef4444','#ec4899',
  '#14b8a6','#f97316','#84cc16','#a855f7',
];

/* ══════════════════════════════════════════
   状态
══════════════════════════════════════════ */
let fields = [];
let activeFilters = new Set(); // 空集合 = 不过滤
let collapsedSections = new Set();

const STORAGE_KEY = 'field_dictionary_v3';

function cloneFields(data) {
  return JSON.parse(JSON.stringify(data));
}

function loadDefaultFields() {
  if (Array.isArray(window.FIELD_DICTIONARY) && window.FIELD_DICTIONARY.length) {
    return cloneFields(window.FIELD_DICTIONARY);
  }
  return null;
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    return Array.isArray(data) && data.length ? data : null;
  } catch {
    return null;
  }
}

function persistFields() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(fields));
  } catch {
    showToast('本地保存失败，请导出 JSON 备份', true);
  }
}

/* ══════════════════════════════════════════
   初始化：本地修改 > fields-data.js > fetch fields.json
══════════════════════════════════════════ */
async function init() {
  fields = loadFromStorage() || loadDefaultFields() || [];

  if (!fields.length) {
    try {
      const res = await fetch('fields.json');
      if (res.ok) fields = await res.json();
    } catch (_) {}
  }

  if (!fields.length) {
    showToast('未加载到字段数据，请确认 fields-data.js 与页面在同一目录', true);
  }

  if (fields.some(f => f.source_type === 'status_select')) {
    fields = fields.map(f =>
      f.source_type === 'status_select' ? { ...f, source_type: 'manual_input' } : f
    );
    persistFields();
  }

  buildFilterChips();
  renderStats();
  renderTable();
}

function resetToDefault() {
  const defaults = loadDefaultFields();
  if (!defaults) {
    showToast('未找到 fields-data.js，无法恢复默认', true);
    return;
  }
  if (!confirm('将清除浏览器中的本地修改，恢复为默认字段字典，确定吗？')) return;
  localStorage.removeItem(STORAGE_KEY);
  fields = defaults;
  renderStats();
  renderTable();
  showToast('已恢复默认数据');
}

/* ══════════════════════════════════════════
   统计卡片
══════════════════════════════════════════ */
function renderStats() {
  const total = fields.length;
  const counts = {};
  fields.forEach(f => { counts[f.source_type] = (counts[f.source_type] || 0) + 1; });

  const cards = [
    { label: '字段总数', value: total, icon: '📋', color: 'from-slate-600 to-slate-500', text: 'text-white' },
    ...Object.entries(TYPE_CONFIG).map(([key, cfg]) => ({
      label: cfg.label, value: counts[key] || 0, icon: cfg.icon, color: 'from-white to-white',
      text: 'text-slate-700', border: true, colorDot: cfg.color
    }))
  ];

  document.getElementById('statsBar').innerHTML = cards.map((c, i) => `
    <div class="rounded-xl p-4 ${c.border ? 'bg-white border border-slate-200 shadow-sm' : `bg-gradient-to-br ${c.color} shadow-md`}">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-xs ${c.border ? 'text-slate-400' : 'text-white/70'} font-medium mb-1">${c.label}</p>
          <p class="text-2xl font-bold ${c.text}">${c.value}</p>
        </div>
        <div class="text-2xl opacity-80">${c.icon}</div>
      </div>
      ${c.colorDot ? `<div class="mt-2 h-1 rounded-full" style="background:${c.colorDot}; opacity:0.3"></div>` : ''}
    </div>
  `).join('');
}

/* ══════════════════════════════════════════
   过滤 chips
══════════════════════════════════════════ */
function buildFilterChips() {
  const el = document.getElementById('filterChips');
  el.innerHTML = Object.entries(TYPE_CONFIG).map(([key, cfg]) => `
    <button onclick="toggleFilter('${key}')" id="chip-${key}"
      class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium border transition-all duration-150
             border-slate-200 text-slate-500 hover:border-slate-400 bg-white" data-key="${key}">
      <span>${cfg.icon}</span>
      <span>${cfg.label}</span>
    </button>
  `).join('');
}

function toggleFilter(key) {
  if (activeFilters.has(key)) activeFilters.delete(key);
  else activeFilters.add(key);

  // 更新 chip 样式
  Object.keys(TYPE_CONFIG).forEach(k => {
    const btn = document.getElementById(`chip-${k}`);
    const cfg = TYPE_CONFIG[k];
    if (activeFilters.has(k)) {
      btn.className = `flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium border transition-all duration-150 text-white`;
      btn.style.background = cfg.color;
      btn.style.borderColor = cfg.color;
    } else {
      btn.className = `flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium border transition-all duration-150 border-slate-200 text-slate-500 hover:border-slate-400 bg-white`;
      btn.style.background = '';
      btn.style.borderColor = '';
    }
  });
  renderTable();
}

/* ══════════════════════════════════════════
   公式渲染
══════════════════════════════════════════ */
function renderFormula(text) {
  if (!text) return '';
  // 把形如 =P-N 中的大写列号换为 badge
  const tagged = text.replace(/\b([A-Z]{1,2})\b(?!\s*[a-z])/g, (match) => {
    const f = fields.find(x => x.col === match);
    const name = f ? f.name_cn : '?';
    return `<span class="formula-tag" title="${name}">${match}<span style="opacity:0.5;margin-left:3px;">${name}</span></span>`;
  });
  return `<span class="formula-eq">${tagged}</span>`;
}

function previewFormula(val) {
  const el = document.getElementById('formulaPreview');
  if (!val) { el.innerHTML = '<span class="text-slate-300 text-xs">输入公式后预览…</span>'; return; }
  el.innerHTML = renderFormula(val);
}

/* ══════════════════════════════════════════
   主渲染
══════════════════════════════════════════ */
function getFilteredFields() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  return fields.filter(f => {
    const matchSearch = !q ||
      f.col.toLowerCase().includes(q) ||
      f.name_cn.includes(q) ||
      (f.name_en || '').toLowerCase().includes(q) ||
      (f.section || '').includes(q);
    const matchFilter = activeFilters.size === 0 || activeFilters.has(f.source_type);
    return matchSearch && matchFilter;
  });
}

function renderTable() {
  const filtered = getFilteredFields();
  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');

  document.getElementById('resultCount').textContent =
    filtered.length === fields.length ? `共 ${fields.length} 个字段` : `${filtered.length} / ${fields.length}`;

  if (!filtered.length) {
    tbody.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  // 按分区分组（保持原始顺序的分区顺序）
  const sectionOrder = [];
  const sectionMap = {};
  filtered.forEach(f => {
    const sec = f.section || '未分类';
    if (!sectionMap[sec]) { sectionMap[sec] = []; sectionOrder.push(sec); }
    sectionMap[sec].push(f);
  });

  // 分区颜色映射（固定，避免颜色跳动）
  const allSections = [...new Set(fields.map(f => f.section || '未分类'))];
  const secColorMap = {};
  allSections.forEach((s, i) => { secColorMap[s] = SECTION_COLORS[i % SECTION_COLORS.length]; });

  let html = '';
  sectionOrder.forEach(sec => {
    const color = secColorMap[sec];
    const isCollapsed = collapsedSections.has(sec);
    const count = sectionMap[sec].length;
    const range = sectionMap[sec][0]?.section_range || '';
    const secId = encodeURIComponent(sec);

    html += `
      <tr class="section-row cursor-pointer select-none" onclick="toggleSection('${secId}')">
        <td colspan="8" class="px-4 py-2.5">
          <div class="flex items-center gap-2">
            <span class="section-bar" style="background:${color}"></span>
            <span class="font-semibold text-slate-700 text-xs">${sec}</span>
            ${range ? `<span class="text-slate-400 text-xs font-mono">${range}</span>` : ''}
            <span class="ml-1 text-xs text-slate-400">${count} 个字段</span>
            <svg class="ml-auto w-3.5 h-3.5 text-slate-400 transition-transform ${isCollapsed ? '-rotate-90' : ''}" id="chevron-${secId}"
              fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
        </td>
      </tr>`;

    sectionMap[sec].forEach(field => {
      const tc = TYPE_CONFIG[field.source_type] || TYPE_CONFIG.manual_input;
      const logicHtml = field.calc_logic ? renderFormula(field.calc_logic) : '<span class="text-slate-200">—</span>';
      const enumHtml = (field.enum_values || []).length
        ? field.enum_values.map(v => `<span class="inline-block bg-slate-100 text-slate-500 text-xs px-1.5 py-0.5 rounded mr-1">${v}</span>`).join('')
        : '';

      html += `
        <tr class="data-row border-t border-slate-50 ${isCollapsed ? 'hidden' : ''}" data-section="${secId}">
          <td class="px-4 py-3">
            <span class="font-mono font-bold text-slate-700 text-sm">${field.col}</span>
          </td>
          <td class="px-4 py-3">
            <button onclick="showDetail(${field.id})" class="text-left hover:text-blue-600 transition-colors">
              <span class="font-medium text-slate-800 block leading-tight">${field.name_cn}</span>
            </button>
          </td>
          <td class="px-4 py-3 text-slate-400 text-xs font-light">${field.name_en || ''}</td>
          <td class="px-4 py-3">
            <span class="${tc.badgeClass} inline-flex items-center gap-1 text-xs px-2 py-1 rounded-full font-medium">
              <span>${tc.icon}</span><span>${tc.label}</span>
            </span>
          </td>
          <td class="px-4 py-3">
            <span class="dtype-${field.data_type} text-xs px-2 py-0.5 rounded font-medium">${field.data_type}</span>
          </td>
          <td class="px-4 py-3 max-w-xs">${logicHtml}${enumHtml ? '<div class="mt-1">'+enumHtml+'</div>' : ''}</td>
          <td class="px-4 py-3 text-slate-500 text-xs leading-relaxed max-w-sm">
            <span class="line-clamp-2" title="${field.description || ''}">${field.description || ''}</span>
          </td>
          <td class="px-4 py-3">
            <div class="flex gap-2">
              <button onclick="editField(${field.id})"
                class="text-xs text-blue-600 hover:text-blue-800 font-medium hover:underline transition-colors">编辑</button>
              <button onclick="deleteField(${field.id})"
                class="text-xs text-rose-500 hover:text-rose-700 font-medium hover:underline transition-colors">删除</button>
            </div>
          </td>
        </tr>`;
    });
  });

  tbody.innerHTML = html;
}

/* ══════════════════════════════════════════
   折叠/展开
══════════════════════════════════════════ */
function toggleSection(secId) {
  const sec = decodeURIComponent(secId);
  const rows = document.querySelectorAll(`tr[data-section="${secId}"]`);
  const chevron = document.getElementById(`chevron-${secId}`);
  if (collapsedSections.has(sec)) {
    collapsedSections.delete(sec);
    rows.forEach(r => r.classList.remove('hidden'));
    chevron?.classList.remove('-rotate-90');
  } else {
    collapsedSections.add(sec);
    rows.forEach(r => r.classList.add('hidden'));
    chevron?.classList.add('-rotate-90');
  }
}

function expandAll() { collapsedSections.clear(); renderTable(); }
function collapseAll() {
  const secs = [...new Set(fields.map(f => f.section || '未分类'))];
  secs.forEach(s => collapsedSections.add(s));
  renderTable();
}

/* ══════════════════════════════════════════
   详情侧栏
══════════════════════════════════════════ */
function showDetail(id) {
  const f = fields.find(x => x.id === id);
  if (!f) return;
  const tc = TYPE_CONFIG[f.source_type] || TYPE_CONFIG.manual_input;
  const allSections = [...new Set(fields.map(x => x.section || '未分类'))];
  const secIdx = allSections.indexOf(f.section || '未分类');
  const color = SECTION_COLORS[secIdx % SECTION_COLORS.length];

  document.getElementById('detailContent').innerHTML = `
    <div class="flex items-start gap-3 pb-4 border-b border-slate-100">
      <div class="w-12 h-12 rounded-xl flex items-center justify-center text-white font-mono font-bold text-lg shadow-sm flex-shrink-0"
           style="background:${color}">${f.col}</div>
      <div>
        <p class="font-semibold text-slate-800">${f.name_cn}</p>
        <p class="text-xs text-slate-400 mt-0.5">${f.name_en || '—'}</p>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3">
      ${detailRow('来源类型', `<span class="${tc.badgeClass} text-xs px-2 py-1 rounded-full">${tc.icon} ${tc.label}</span>`)}
      ${detailRow('数据类型', `<span class="dtype-${f.data_type} text-xs px-2 py-0.5 rounded">${f.data_type}</span>`)}
      ${detailRow('所属分区', f.section || '—')}
      ${detailRow('列范围', f.section_range || '—')}
    </div>
    ${f.calc_logic ? `
    <div class="bg-slate-50 rounded-xl p-3 border border-slate-100">
      <p class="text-xs font-medium text-slate-500 mb-2">计算逻辑</p>
      <div class="flex flex-wrap gap-1">${renderFormula(f.calc_logic)}</div>
    </div>` : ''}
    ${(f.enum_values || []).length ? `
    <div>
      <p class="text-xs font-medium text-slate-500 mb-2">枚举值</p>
      <div class="flex flex-wrap gap-1.5">
        ${f.enum_values.map(v => `<span class="bg-slate-100 text-slate-600 text-xs px-2 py-1 rounded-lg">${v}</span>`).join('')}
      </div>
    </div>` : ''}
    <div class="bg-blue-50 rounded-xl p-3 border border-blue-100">
      <p class="text-xs font-medium text-blue-600 mb-1.5">字段说明</p>
      <p class="text-xs text-slate-600 leading-relaxed">${f.description || '暂无说明'}</p>
    </div>
    <div class="flex gap-2 pt-2">
      <button onclick="editField(${f.id}); closeDetail()"
        class="flex-1 text-xs bg-blue-600 text-white rounded-lg py-2 hover:bg-blue-500 transition-colors font-medium">编辑字段</button>
      <button onclick="if(confirm('确定删除？')) { deleteField(${f.id}); closeDetail(); }"
        class="px-4 text-xs bg-rose-50 text-rose-600 border border-rose-200 rounded-lg py-2 hover:bg-rose-100 transition-colors">删除</button>
    </div>
  `;
  document.getElementById('detailPanel').classList.remove('translate-x-full');
}

function detailRow(label, val) {
  return `<div class="bg-slate-50 rounded-lg p-2.5"><p class="text-xs text-slate-400 mb-1">${label}</p><p class="text-xs font-medium text-slate-700">${val}</p></div>`;
}

function closeDetail() {
  document.getElementById('detailPanel').classList.add('translate-x-full');
}

/* ══════════════════════════════════════════
   CRUD
══════════════════════════════════════════ */
function openModal(id = null) {
  document.getElementById('editModal').classList.remove('hidden');
  document.getElementById('editModal').classList.add('flex');
  document.getElementById('fieldForm').reset();
  document.getElementById('formulaPreview').innerHTML = '<span class="text-slate-300 text-xs">输入公式后预览…</span>';

  if (id) {
    const f = fields.find(x => x.id === id);
    document.getElementById('modalTitle').textContent = '编辑字段';
    document.getElementById('fieldId').value = f.id;
    document.getElementById('col').value = f.col;
    document.getElementById('name_cn').value = f.name_cn;
    document.getElementById('name_en').value = f.name_en || '';
    document.getElementById('data_type').value = f.data_type;
    document.getElementById('source_type').value = f.source_type;
    document.getElementById('section').value = f.section || '';
    document.getElementById('calc_logic').value = f.calc_logic || '';
    document.getElementById('enum_values').value = (f.enum_values || []).join(',');
    document.getElementById('description').value = f.description || '';
    previewFormula(f.calc_logic || '');
  } else {
    document.getElementById('modalTitle').textContent = '新增字段';
    document.getElementById('fieldId').value = '';
  }
}

function closeModal() {
  document.getElementById('editModal').classList.add('hidden');
  document.getElementById('editModal').classList.remove('flex');
}

function saveField() {
  const id = document.getElementById('fieldId').value;
  const enumRaw = document.getElementById('enum_values').value.trim();
  const newData = {
    id: id ? parseInt(id) : Date.now(),
    col: document.getElementById('col').value.toUpperCase(),
    name_cn: document.getElementById('name_cn').value,
    name_en: document.getElementById('name_en').value,
    data_type: document.getElementById('data_type').value,
    source_type: document.getElementById('source_type').value,
    section: document.getElementById('section').value,
    section_range: '',
    calc_logic: document.getElementById('calc_logic').value,
    enum_values: enumRaw ? enumRaw.split(',').map(s => s.trim()).filter(Boolean) : [],
    description: document.getElementById('description').value
  };

  if (id) {
    const idx = fields.findIndex(x => x.id == id);
    fields[idx] = newData;
  } else {
    fields.push(newData);
  }

  closeModal();
  persistFields();
  renderStats();
  renderTable();
}

function editField(id) { openModal(id); }

function deleteField(id) {
  if (confirm('确定要删除这个字段吗？')) {
    fields = fields.filter(x => x.id !== id);
    persistFields();
    renderStats();
    renderTable();
  }
}

/* ══════════════════════════════════════════
   导入 / 导出
══════════════════════════════════════════ */
function exportJSON() {
  const blob = new Blob([JSON.stringify(fields, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'fields.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      fields = JSON.parse(e.target.result);
      persistFields();
      renderStats(); renderTable();
      showToast('✅ 导入成功，共 ' + fields.length + ' 个字段');
    } catch (_) { showToast('❌ JSON 格式错误', true); }
  };
  reader.readAsText(file);
  input.value = '';
}

/* ══════════════════════════════════════════
   Toast 提示
══════════════════════════════════════════ */
function showToast(msg, isError = false) {
  const t = document.createElement('div');
  t.className = `fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl shadow-lg text-sm text-white font-medium
    ${isError ? 'bg-rose-500' : 'bg-slate-700'} transition-opacity`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2500);
}

/* ══════════════════════════════════════════
   搜索
══════════════════════════════════════════ */
document.getElementById('searchInput').addEventListener('input', () => renderTable());

/* 点击模态框背景关闭 */
document.getElementById('editModal').addEventListener('click', e => {
  if (e.target === document.getElementById('editModal')) closeModal();
});

/* ══════════════════════════════════════════
   启动
══════════════════════════════════════════ */
init();
</script>
